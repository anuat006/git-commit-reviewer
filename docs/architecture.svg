<svg xmlns='http://www.w3.org/2000/svg' style='background:#ffffff' viewBox='0 0 760 560' role='img' aria-label='The agent calls three MCP tools and a human approves before any issue is filed' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#9a9a92'/></marker></defs><rect width='760' height='560' fill='#ffffff'/><text x='24' y='28' font-size='15' font-weight='600' fill='#1a1a1a'>The agent calls three MCP tools; a human approves before any issue is filed</text><g><rect x='24' y='56' width='216' height='40' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='132.0' y='76' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>CLI</text><text x='132.0' y='93' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>validates args, loads .env</text></g><g><rect x='310' y='56' width='200' height='40' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='410.0' y='76' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>.env</text><text x='410.0' y='93' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>tokens, ISSUE_REPO, TTL</text></g><g><rect x='560' y='62' width='14' height='14' rx='3' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='582' y='73' font-size='11.5' fill='#5f5f5a'>MCP tool (stdio server)</text><rect x='560' y='80' width='14' height='14' rx='3' fill='#e3a008' fill-opacity='0.12' stroke='#e3a008' stroke-width='2'/><text x='582' y='91' font-size='11.5' fill='#5f5f5a'>Human decision</text></g><g><rect x='24' y='112' width='216' height='424' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='40' y='132' font-size='13' font-weight='600' fill='#1a1a1a'>Root agent (LangGraph)</text></g><g><rect x='40' y='152' width='184' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='132.0' y='172' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>get_diff</text><text x='132.0' y='189' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>reads changed files</text></g><g><rect x='40' y='216' width='184' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='132.0' y='236' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>scan</text><text x='132.0' y='253' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>runs the secret scan</text></g><g><rect x='40' y='280' width='184' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='132.0' y='300' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>diagnose</text><text x='132.0' y='317' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>severity, risk, advice</text></g><g><rect x='40' y='344' width='184' height='48' rx='8' fill='#e3a008' fill-opacity='0.12' stroke='#e3a008' stroke-width='2'/><text x='132.0' y='364' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>gate</text><text x='132.0' y='381' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>asks you yes or no</text></g><g><rect x='40' y='408' width='184' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='132.0' y='428' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>create_issue</text><text x='132.0' y='445' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>files the issue once</text></g><g><rect x='40' y='472' width='184' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='132.0' y='492' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>finish</text><text x='132.0' y='509' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>records the final entry</text></g><g fill='none' stroke='#9a9a92' stroke-width='1.25'><path d='M132 96L132 112' marker-end='url(#arch-arrow)'/><path d='M310 76L240 76' marker-end='url(#arch-arrow)'/><path d='M132 200L132 216' marker-end='url(#arch-arrow)'/><path d='M132 264L132 280' marker-end='url(#arch-arrow)'/><path d='M132 328L132 344' marker-end='url(#arch-arrow)'/><path d='M132 392L132 408' marker-end='url(#arch-arrow)'/><path d='M132 456L132 472' marker-end='url(#arch-arrow)'/><path d='M224 176L310 176' marker-end='url(#arch-arrow)'/><path d='M224 240L310 240' marker-end='url(#arch-arrow)'/><path d='M224 304L310 304' marker-end='url(#arch-arrow)'/><path d='M224 368L310 368' marker-end='url(#arch-arrow)'/><path d='M224 432L310 432' marker-end='url(#arch-arrow)'/><path d='M224 496L310 496' marker-end='url(#arch-arrow)'/><path d='M510 176L560 176' marker-end='url(#arch-arrow)'/><path d='M510 240L560 240' marker-end='url(#arch-arrow)'/><path d='M510 304L560 304' marker-end='url(#arch-arrow)'/><path d='M510 368L560 368' marker-end='url(#arch-arrow)'/><path d='M510 432L560 432' marker-end='url(#arch-arrow)'/></g><g><rect x='310' y='152' width='200' height='48' rx='8' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='410.0' y='172' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>get_commit_diff</text><text x='410.0' y='189' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>changed file names only</text></g><g><rect x='310' y='216' width='200' height='48' rx='8' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='410.0' y='236' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>scan_commit</text><text x='410.0' y='253' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>redacted findings</text></g><g><rect x='310' y='280' width='200' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='410.0' y='300' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Model gateway</text><text x='410.0' y='317' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>local or copilot</text></g><g><rect x='310' y='344' width='200' height='48' rx='8' fill='#e3a008' fill-opacity='0.12' stroke='#e3a008' stroke-width='2'/><text x='410.0' y='364' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Human approval</text><text x='410.0' y='381' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>yes issues a one-time token</text></g><g><rect x='310' y='408' width='200' height='48' rx='8' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='410.0' y='428' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>create_security_issue</text><text x='410.0' y='445' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>needs the approval token</text></g><g><rect x='310' y='472' width='200' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='410.0' y='492' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Audit log</text><text x='410.0' y='509' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>audit_log.jsonl, every step</text></g><g><rect x='560' y='152' width='176' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='648.0' y='172' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Local git repo</text><text x='648.0' y='189' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>git diff-tree</text></g><g><rect x='560' y='216' width='176' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='648.0' y='236' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Gitleaks</text><text x='648.0' y='253' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>custom rules.toml</text></g><g><rect x='560' y='280' width='176' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='648.0' y='300' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Model API</text><text x='648.0' y='317' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>Ollama or GitHub Models</text></g><g><rect x='560' y='344' width='176' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='648.0' y='364' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>You</text><text x='648.0' y='381' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>approve in the terminal</text></g><g><rect x='560' y='408' width='176' height='48' rx='8' fill='none' stroke='#9a9a92' stroke-width='1.25'/><text x='648.0' y='428' text-anchor='middle' font-size='13' font-weight='600' fill='#1a1a1a'>Issue tracker repo</text><text x='648.0' y='445' text-anchor='middle' font-size='11.5' fill='#5f5f5a'>GitHub REST API</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>